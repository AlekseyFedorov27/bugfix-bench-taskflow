[project]
name = "taskflow"
version = "0.1.0"
description = "Task management library with intentional bugs (bugfix agent benchmark)"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"